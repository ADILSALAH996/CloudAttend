<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | CloudAttend</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- CloudAttend Logo -->
            <div class="auth-logo">
                <div class="logo-icon">CA</div>
            </div>

            <!-- Heading -->
            <h1>Student Login</h1>

            <p class="auth-subtitle">
                Sign in to view your attendance and mark sessions.
            </p>

            <!-- Login Form -->
            <form id="student-login-form">

                <div class="form-group">

                    <label for="student-id">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="student-id"
                        name="studentId"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="student-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="student-password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Sign In
                </button>

            </form>


            <!-- Role Switch -->
            <div class="auth-divider"></div>

            <p class="auth-switch">
                Are you a teacher?
                <a href="teacher-login.html">
                    Teacher Login
                </a>
            </p>


            <!-- Back -->
            <a
                href="../index.html"
                class="auth-back"
            >
                ← Back to CloudAttend
            </a>

        </div>

    </main>


    <script src="../assets/js/script.js"></script>

</body>

</html>
